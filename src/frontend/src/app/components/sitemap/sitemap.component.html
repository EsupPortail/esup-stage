<nav aria-label="Plan du site">
  @for (group of groups; track group) {
    <div class="fr-mb-4w">
      <h4 class="fr-h4">{{ group.name }}</h4>
      <ul class="fr-list">
        @for (item of group.items; track item) {
          <li>
            <a [routerLink]="item.url">
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </div>
  }
</nav>
