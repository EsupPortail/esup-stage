databaseChangeLog:
  # Ticket #716 / #742 : suppression des brouillons de convention en doublon pour un même loginCreation.
  # Un brouillon actif est une convention avec validationCreation = 0 et creationEnMasse = 0.
  # On conserve le brouillon ayant le plus grand idConvention (le plus récent) et on supprime les autres
  # ainsi que leurs données liées.
  - changeSet:
      id: 3.2.9-suppression-brouillons-convention-doublons
      author: thouveno9
      dbms: mysql,mariadb
      comment: "Suppression des brouillons de convention en doublon (conservation du plus grand idConvention)"
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              -- Table de travail : ids des brouillons à supprimer (tous sauf le plus récent).
              -- IF NOT EXISTS + DELETE FROM rendent le changeset rejouable après un échec partiel.
              CREATE TABLE IF NOT EXISTS ConventionBrouillonDoublon (
                idConvention INT NOT NULL PRIMARY KEY
              );

              DELETE FROM ConventionBrouillonDoublon;

              INSERT INTO ConventionBrouillonDoublon (idConvention)
              SELECT c.idConvention
              FROM Convention c
              JOIN (
                SELECT loginCreation, MAX(idConvention) AS idConventionConservee
                FROM Convention
                WHERE validationCreation = 0 AND creationEnMasse = 0 AND loginCreation IS NOT NULL
                GROUP BY loginCreation
                HAVING COUNT(*) > 1
              ) d ON d.loginCreation = c.loginCreation
              WHERE c.validationCreation = 0
                AND c.creationEnMasse = 0
                AND c.idConvention < d.idConventionConservee;

              -- Enfants : PeriodeInterruptionAvenant avant Avenant et PeriodeInterruptionStage
              DELETE pia FROM PeriodeInterruptionAvenant pia
              JOIN PeriodeInterruptionStage pis ON pis.id = pia.idPeriodeInterruptionStage
              JOIN ConventionBrouillonDoublon d ON d.idConvention = pis.idConvention;

              DELETE pia FROM PeriodeInterruptionAvenant pia
              JOIN Avenant a ON a.idAvenant = pia.idAvenant
              JOIN ConventionBrouillonDoublon d ON d.idConvention = a.idConvention;

              DELETE a FROM Avenant a
              JOIN ConventionBrouillonDoublon d ON d.idConvention = a.idConvention;

              DELETE pis FROM PeriodeInterruptionStage pis
              JOIN ConventionBrouillonDoublon d ON d.idConvention = pis.idConvention;

              DELETE ps FROM PeriodeStage ps
              JOIN ConventionBrouillonDoublon d ON d.idConvention = ps.convention_id;

              DELETE hv FROM HistoriqueValidation hv
              JOIN ConventionBrouillonDoublon d ON d.idConvention = hv.idConvention;

              DELETE re FROM ReponseEvaluation re
              JOIN ConventionBrouillonDoublon d ON d.idConvention = re.idConvention;

              DELETE rs FROM ReponseSupplementaire rs
              JOIN ConventionBrouillonDoublon d ON d.idConvention = rs.idConvention;

              DELETE et FROM EvaluationTuteurToken et
              JOIN ConventionBrouillonDoublon d ON d.idConvention = et.idConvention;

              DELETE cn FROM ConventionNomenclature cn
              JOIN ConventionBrouillonDoublon d ON d.idConvention = cn.idConvention;

              -- Conventions de groupe rattachées (données historiques avec creationEnMasse=0)
              DELETE hmg FROM HistoriqueMailGroupe hmg
              JOIN GroupeEtudiant ge ON ge.idGroupeEtudiant = hmg.idGroupeEtudiant
              JOIN ConventionBrouillonDoublon d ON d.idConvention = ge.idConvention;

              DELETE ege FROM EtudiantGroupeEtudiant ege
              JOIN ConventionBrouillonDoublon d ON d.idConvention = ege.idConvention;

              DELETE ege FROM EtudiantGroupeEtudiant ege
              JOIN GroupeEtudiant ge ON ge.idGroupeEtudiant = ege.idGroupeEtudiant
              JOIN ConventionBrouillonDoublon d ON d.idConvention = ge.idConvention;

              UPDATE EtudiantGroupeEtudiant ege
              JOIN ConventionBrouillonDoublon d ON d.idConvention = ege.idMergedConvention
              SET ege.idMergedConvention = NULL;

              DELETE ge FROM GroupeEtudiant ge
              JOIN ConventionBrouillonDoublon d ON d.idConvention = ge.idConvention;

              DELETE c FROM Convention c
              JOIN ConventionBrouillonDoublon d ON d.idConvention = c.idConvention;

              DROP TABLE ConventionBrouillonDoublon;

  # Garantie d'unicité : un loginCreation ne peut avoir qu'un seul brouillon actif.
  # MariaDB/MySQL ne supportant pas les index partiels, on passe par une colonne générée qui vaut
  # loginCreation pour un brouillon actif et NULL sinon (les NULL ne sont pas soumis à l'unicité).
  - changeSet:
      id: 3.2.9-unicite-brouillon-convention
      author: thouveno9
      dbms: mysql,mariadb
      comment: "Contrainte d'unicité d'un brouillon actif de convention par loginCreation"
      preConditions:
        - onFail: HALT
        - onFailMessage: "Des brouillons de convention en doublon subsistent : impossible d'ajouter la contrainte d'unicité."
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT COUNT(*) FROM (
                SELECT loginCreation
                FROM Convention
                WHERE validationCreation = 0 AND creationEnMasse = 0 AND loginCreation IS NOT NULL
                GROUP BY loginCreation
                HAVING COUNT(*) > 1
              ) doublons
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE Convention
                ADD COLUMN loginCreationBrouillon VARCHAR(150)
                AS (CASE WHEN validationCreation = 0 AND creationEnMasse = 0 THEN loginCreation ELSE NULL END) STORED;
        - createIndex:
            tableName: Convention
            indexName: uk_convention_brouillon_login
            unique: true
            columns:
              - column:
                  name: loginCreationBrouillon
      rollback:
        - dropIndex:
            tableName: Convention
            indexName: uk_convention_brouillon_login
        - dropColumn:
            tableName: Convention
            columnName: loginCreationBrouillon
