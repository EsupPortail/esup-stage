      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM CronTask WHERE nom = 'SupprimerServicesInutilises'
      changes:
        - insert:
            tableName: CronTask
            columns:
              - column:
                  name: nom
                  value: SupprimerServicesInutilises
              - column:
                  name: expressionCron
                  value: 0 30 4 1 * ?
              - column:
